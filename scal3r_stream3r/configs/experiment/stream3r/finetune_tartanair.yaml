# @package _global_

defaults:
  - override /model: stream3r

seed: 42
tags: ["finetune", "tartanair"]
task_name: finetune_tartanair
slurm_job_id: 99999  # must set in the command line
test: False

paths:
  run_folder_name: ${task_name}_${slurm_job_id}

logger:
  wandb: null

data:
  data_scaling: 1.0
  data_root: data/mast3r_data
  num_views: 24
  resolution:
    - [518, 392]
    - [518, 378]
    - [518, 336]
    - [518, 294]
    - [518, 252]
    - [518, 210]
    - [518, 140]
    - [378, 518]
    - [336, 518]
    - [294, 518]
    - [252, 518]
    - [224, 224]
  allow_repeat: true
  n_corres_train: 0
  data_module:
    _target_: stream3r.data.multiview_dust3r_datamodule.MultiViewDUSt3RDataModule
    pin_memory: true
    num_workers: 16
    num_workers_val: 1
    batch_size_per_device: 1
    batch_size_per_device_val: 1
    train_datasets:
      - 4000 @ TartanAirWds_Multi(allow_repeat=${data.allow_repeat}, split=None, ROOT="${data.data_root}/processed_tartanair_wds_v2cc/", aug_crop=16, resolution=${data.resolution}, transform=ColorJitter, num_views=${data.num_views}, n_corres=${data.n_corres_train})

model:
  pretrained: weights/stream3r/model.pt
  net:
    freeze: encoder

  scheduler:
    warmup_start_lr: 1e-6
    warmup_epochs: 5

  train_criterion:
    _target_: stream3r.loss.losses.CausalLoss
    gradient_loss: grad
    is_metric: false

  validation_criterion:
    _target_: stream3r.loss.losses.CausalLoss
    gradient_loss: grad
    is_metric: false

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 5e-6
    betas:
      - 0.9
      - 0.95
    weight_decay: 0.05

trainer:
  devices: auto
  max_epochs: 40
  accumulate_grad_batches: 4
  strategy:
    _target_: lightning.pytorch.strategies.DeepSpeedStrategy
    timeout:
      _target_: datetime.timedelta
      minutes: 80
  limit_val_batches: 0
  precision: bf16-mixed
  log_every_n_steps: 20

callbacks:
  model_checkpoint:
    every_n_train_steps: null
    every_n_epochs: 1
    save_on_train_epoch_end: true
    save_top_k: -1
    filename: "{epoch:03d}-{step:08d}"
    save_last: true
    monitor: "train/loss"
  early_stopping:
    monitor: "train/loss"
