model: "ARCroco3DStereo(ARCroco3DStereoConfig(freeze='encoder_and_decoder_and_head', state_size=768, state_pe='2d', pos_embed='RoPE100', rgb_head=True, pose_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512, 512), head_type='dpt', output_mode='pts3d+pose+relative_pose', depth_mode=('exp', -inf, inf), conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24, enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False, num_prompt_tokens=1, use_mask_attention=True))"
pretrained: cut3r_512_dpt_4_64.pth
load_only_encoder: False
long_context: False
fixed_length: True
resume: null
benchmark: True
num_views : 4
num_test_views : 4
n_corres_train: 0
n_corres_test: 0

# Loss configuration
# Available switches in ConfLoss:
#   use_pts_loss: Confidence-weighted point cloud loss (default: True)
#   use_pose_loss: Absolute camera pose loss (default: False)
#   use_relative_pose_loss: Relative pose token loss (default: True)
#   rot_loss_weight: Weight for rotation loss (default: 10.0, increase if rotation is not learning well)
#   trans_loss_weight: Weight for translation loss (default: 1.0, increase for small-scale datasets like TartanAir)
# Disabled losses are NOT computed, improving training speed
train_criterion: ConfLoss(Regr3DPoseBatchList(L21, norm_mode='?avg_dis', use_pts_loss=False, use_pose_loss=False, use_relative_pose_loss=True, rot_loss_weight=1.0, trans_loss_weight=1.0, use_align_scale=True), alpha=0.2)
test_criterion: Regr3DPose(L21, norm_mode='?avg_dis', gt_scale=False, sky_loss_value=0) + Regr3DPose_ScaleInv(L21, norm_mode='?avg_dis', gt_scale=False, sky_loss_value=0)

