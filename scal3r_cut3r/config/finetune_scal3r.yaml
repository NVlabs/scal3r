weight_decay: 0.05
lr: 1.0e-04
min_lr: 1.0e-06
warmup_epochs: 5
amp: 1

num_workers: 16
world_size: 1
local-rank: -1
dist_url: 'env://'
rank: 0
gpu: 0
distributed: False
dist_backend: 'nccl'

eval_freq: 1
save_freq: 1
keep_freq: 5
print_freq: 100
